<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NTHU Campus Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">NTHU Campus Assistant</a>
    <nav>
      <a href="{{ url_for('home') }}"
         class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('announcements') }}"
         class="{{ 'active' if request.endpoint == 'announcements' }}">Announcements</a>
      {# Các trang của Manh và Nhan sẽ thêm vào đây khi xong #}
      <span class="soon" title="Coming soon">Calendar</span>
      <span class="soon" title="Coming soon">Study</span>
      <span class="soon" title="Coming soon">GPA</span>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">I2P Final Project &middot; NTHU</footer>
</body>
</html>
