{% extends "base.html" %}

{% block title %}Log in - NTHU Campus Assistant{% endblock %}

{% block content %}
<form class="form-card" method="post" action="{{ url_for('login') }}">
  <h1>Log in</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">

  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
  </div>

  <button class="btn" type="submit">Log in</button>
  <p class="form-note">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
</form>
{% endblock %}
