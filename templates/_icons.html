{# Biểu tượng SVG đơn giản (nét 2px, kế thừa màu chữ). Dùng: {{ icon('calendar') }} #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'home' %}
    <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>
  {% elif name == 'calendar' %}
    <rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
  {% elif name == 'schedule' %}
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  {% elif name == 'gpa' %}
    <path d="M3 9.5 12 5l9 4.5-9 4.5z"/><path d="M7 12v4.5c1.5 1.6 3.2 2.3 5 2.3s3.5-.7 5-2.3V12"/>
  {% elif name == 'study' %}
    <rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="m8.5 9 1.7 1.7L13.5 7.5M8.5 15.5h7"/>
  {% elif name == 'news' %}
    <path d="M4 10.5v3a1.5 1.5 0 0 0 1.5 1.5H8l6 4V5L8 9H5.5A1.5 1.5 0 0 0 4 10.5z"/><path d="M18 9.5a4 4 0 0 1 0 5"/>
  {% elif name == 'map' %}
    <path d="M9 4.5 3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z"/><path d="M9 4.5v13M15 6.5v13"/>
  {% elif name == 'moon' %}
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
  {% elif name == 'sun' %}
    <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
  {% elif name == 'year' %}
    <rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/>
    <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>
  {% endif %}
</svg>
{%- endmacro %}
